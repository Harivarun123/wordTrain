<!DOCTYPE html>
<html>
<head>
    <title>Word Train</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <h1>Word Train</h1>

    <div id="startscreen">

        <h2>Starting a New Train</h2>

        <input id="startwordinput" type="text" placeholder="starting word">
        <button id="startbutton">Start Game</button>
         <p id="startmessage"></p>

    </div>

    <div id="gamescreen">

        <div id="gamearea">
            <p id="length">Length : 0</p>

            <span id="requiredword"></span>
            <input id="nextwordinput" type="text" placeholder="Next word">
            <button id = "submitbutton" >Submit</button>
            <button id="restartbutton">Restart Game</button>

            <p id="message"></p>
        </div>

        <div id="historyarea">
            <h3>Train History</h3>
            <div id="history"></div>
        </div>
            
    </div>



    <script src="main.js"></script>

</body>
</html>
